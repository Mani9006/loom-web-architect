<!doctype html>
<!-- Local mock of a Greenhouse-hosted application form. The #grnhse_app
     wrapper and #application-form id make the real greenhouse adapter's
     page-based detection + form resolution match, so the worker's processJob
     flow exercises production code paths against this fixture. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="generator" content="mock greenhouse board">
  <title>Acme — Senior Frontend Engineer</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input, textarea { width: 24rem; padding: 0.4rem; }
  </style>
</head>
<body>
  <div id="grnhse_app">
    <h1>Senior Frontend Engineer</h1>
    <p>Acme Corp — Remote</p>

    <form id="application-form" action="/submit" method="post" enctype="multipart/form-data" data-sitekey="mock-invisible-sitekey">
      <div class="field">
        <label for="first_name">First Name *</label>
        <input type="text" id="first_name" name="first_name" required>
      </div>
      <div class="field">
        <label for="last_name">Last Name *</label>
        <input type="text" id="last_name" name="last_name" required>
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone *</label>
        <input type="text" id="phone" name="phone" required>
      </div>
      <div class="field">
        <label for="resume">Resume *</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
      </div>
      <div class="field application-question">
        <label for="question_why">Why do you want to work at Acme? *</label>
        <textarea id="question_why" name="question_why" rows="3" required></textarea>
      </div>
      <div class="field application-question">
        <label for="question_react">How many years of React experience do you have? *</label>
        <input type="text" id="question_react" name="question_react" required>
      </div>

      <!-- Old-style Greenhouse EMPLOYMENT HISTORY section. Starts with one
           block; "+ Add Another Employment" clones it (re-indexed, cleared).
           Fields are intentionally NOT required so the existing mock-e2e
           submit path stays green when no experience payload is present. -->
      <fieldset id="employment_history" class="employment-section">
        <legend>Employment History</legend>
        <div class="employment-block" id="employment_block_0">
          <div class="field">
            <label for="eh_company_0">Company name</label>
            <input type="text" id="eh_company_0" name="eh_company_0">
          </div>
          <div class="field">
            <label for="eh_title_0">Title</label>
            <input type="text" id="eh_title_0" name="eh_title_0">
          </div>
          <div class="field date-group">
            <span class="group-label">Start date</span>
            <label for="eh_start_month_0">Month</label>
            <select id="eh_start_month_0" name="eh_start_month_0">
              <option value="">Select...</option>
              <option value="1">January</option><option value="2">February</option>
              <option value="3">March</option><option value="4">April</option>
              <option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option>
              <option value="9">September</option><option value="10">October</option>
              <option value="11">November</option><option value="12">December</option>
            </select>
            <label for="eh_start_year_0">Year</label>
            <input type="text" id="eh_start_year_0" name="eh_start_year_0" maxlength="4">
          </div>
          <div class="field date-group">
            <span class="group-label">End date</span>
            <label for="eh_end_month_0">Month</label>
            <select id="eh_end_month_0" name="eh_end_month_0">
              <option value="">Select...</option>
              <option value="1">January</option><option value="2">February</option>
              <option value="3">March</option><option value="4">April</option>
              <option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option>
              <option value="9">September</option><option value="10">October</option>
              <option value="11">November</option><option value="12">December</option>
            </select>
            <label for="eh_end_year_0">Year</label>
            <input type="text" id="eh_end_year_0" name="eh_end_year_0" maxlength="4">
          </div>
          <div class="field">
            <label><input type="checkbox" id="eh_current_0" name="eh_current_0"> I currently work here</label>
          </div>
          <div class="field">
            <label for="eh_location_0">Location</label>
            <input type="text" id="eh_location_0" name="eh_location_0">
          </div>
        </div>
        <button type="button" id="add_employment">+ Add Another Employment</button>
      </fieldset>

      <button type="submit" id="submit_app">Submit application</button>
    </form>
  </div>

  <!-- Invisible reCAPTCHA Enterprise markers, as on real Greenhouse boards:
       a fixed visible badge, a hidden invisible-size widget container, and a
       v3 script tag. These must NOT be classified as a CAPTCHA blocker. -->
  <div class="grecaptcha-badge" style="position: fixed; right: 14px; bottom: 14px; width: 70px; height: 60px;"></div>
  <div class="g-recaptcha" data-sitekey="mock-invisible-sitekey" data-size="invisible" style="display: none;"></div>
  <script src="/recaptcha-enterprise.js" async></script>

  <script>
    // "+ Add Another Employment": clone the last block, re-index ids/names,
    // clear all values (mirrors the real board's append behavior).
    document.getElementById("add_employment").addEventListener("click", () => {
      const section = document.getElementById("employment_history");
      const blocks = section.querySelectorAll(".employment-block");
      const next = blocks.length;
      const clone = blocks[blocks.length - 1].cloneNode(true);
      clone.id = `employment_block_${next}`;
      clone.querySelectorAll("[id], [name], [for]").forEach((el) => {
        for (const attr of ["id", "name", "for"]) {
          const value = el.getAttribute(attr);
          if (value) el.setAttribute(attr, value.replace(/_\d+$/, `_${next}`));
        }
      });
      clone.querySelectorAll("input, select, textarea").forEach((el) => {
        if (el.type === "checkbox") el.checked = false;
        else el.value = "";
      });
      section.insertBefore(clone, document.getElementById("add_employment"));
    });

    // Stand-in for the Greenhouse submission endpoint: validate like the real
    // form would, then render the confirmation container the adapter's
    // verifyReceipt() looks for.
    document.getElementById("application-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const confirmation = document.createElement("div");
      confirmation.id = "application_confirmation";
      confirmation.innerHTML =
        "<h2>Thank you for applying!</h2>" +
        "<p>Your application has been received. Application ID: MOCK-12345</p>";
      form.replaceWith(confirmation);
    });
  </script>
</body>
</html>
