name: Quality gate

# Runs on every push and PR. Must pass before merge to main or production.
# Vercel handles its own preview deploy in parallel — this workflow only
# verifies the code compiles, types, and tests.

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Lint changed application files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^(src/|scripts/).+\.(ts|tsx|js|jsx|mjs)$' \
            | grep -v '^src/integrations/supabase/types.ts$' \
            > /tmp/lint-files.txt || true
          if [ -s /tmp/lint-files.txt ]; then
            xargs -d '\n' npx eslint < /tmp/lint-files.txt
          else
            echo "No changed application files require linting."
          fi

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Use staging env at build time so we exercise the same code paths
          # production builds will use.
          VITE_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
