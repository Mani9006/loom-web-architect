name: Quality gate

# Runs on every push and PR. Must pass before merge to main or production.
# Vercel handles its own preview deploy in parallel — this workflow only
# verifies the entire repository lints, compiles, types, and tests.

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Lint repository
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          # The Supabase client throws at import time if these are unset, and
          # several unit tests import it transitively (none of the unit tests
          # make real network calls), so a placeholder is fine here — fall
          # back to one whenever the staging secrets aren't configured for
          # this run, rather than letting an unrelated secrets gap fail
          # every PR's test step.
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_REF || 'placeholder' }}

      - name: Build
        run: npm run build
        env:
          # Use staging env at build time so we exercise the same code paths
          # production builds will use. Same placeholder fallback as Test —
          # the build never calls out to Supabase, it only needs non-empty
          # values so the client module doesn't throw at import time.
          VITE_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_REF || 'placeholder' }}
