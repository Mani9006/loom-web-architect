name: Quality gate

# Runs on every push and PR. Must pass before promotion from develop to main.
# Vercel handles its own preview deploy in parallel — this workflow only
# verifies the entire repository lints, compiles, types, and tests.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Dependency security gate
        run: npm run audit:ci

      - name: Test dependency audit policy
        run: npm run test:audit-policy

      - name: Type check
        run: npm run type-check

      - name: Lint repository
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test ATS adapters
        run: npm run test:adapters

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "v2.8.1"
          cache: true

      - name: Check critical Edge functions
        run: npm run check:edge-functions

      - name: Build
        run: npm run build
        env:
          # Use staging env at build time so we exercise the same code paths
          # production builds will use.
          VITE_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
