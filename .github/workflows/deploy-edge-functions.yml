name: Deploy edge functions

# Deploys all supabase/functions/* to the corresponding environment when code
# lands on develop (→ DEV/staging). Production is deliberately manual: dispatch
# this workflow from main and type the exact confirmation phrase below.

on:
  push:
    branches: [develop]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Force deploy to a specific environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      confirm_production:
        description: "For production only, type DEPLOY_PRODUCTION_FROM_MAIN"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Validate deployment boundary
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          set -Eeuo pipefail
          if [ "$REQUESTED_ENVIRONMENT" = "production" ]; then
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || {
              echo "::error::Production deployment must be manually dispatched."
              exit 1
            }
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::Production deployment is restricted to refs/heads/main."
              exit 1
            }
            [ "$PRODUCTION_CONFIRMATION" = "DEPLOY_PRODUCTION_FROM_MAIN" ] || {
              echo "::error::Production confirmation phrase did not match."
              exit 1
            }
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Automatic staging deployment is restricted to refs/heads/develop."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
          DB_PASSWORD_PRODUCTION: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          REQUESTED_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$REQUESTED_ENVIRONMENT" = "production" ]; then
            REF="${{ secrets.SUPABASE_PROJECT_REF_PROD }}"
            ENV_NAME="production"
            SUPABASE_DB_PASSWORD="$DB_PASSWORD_PRODUCTION"
          else
            REF="${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
            ENV_NAME="staging"
            SUPABASE_DB_PASSWORD="$DB_PASSWORD_STAGING"
          fi
          export SUPABASE_DB_PASSWORD
          if [ -z "$REF" ]; then
            echo "::error::Missing Supabase project ref for $ENV_NAME."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing database password for $ENV_NAME. Refusing to deploy functions against an unverified schema."
            exit 1
          fi
          supabase link --project-ref "$REF"
          echo "Verifying migrations for $ENV_NAME"
          supabase db push --linked --dry-run
          echo "Applying migrations to $ENV_NAME"
          supabase db push --linked

          # Release only the functions covered by this recovery release. This
          # keeps unrelated legacy endpoints out of the deployment blast radius.
          FUNCTIONS=(
            agents-job-hunter
            applypass-agent-queue
            applypass-browser-session
            ats-score
            ats-score-v2
            career-agent-control
            career-ops-ats
            career-ops-bootstrap
            career-ops-evaluate
            career-ops-one-click
            career-ops-submit
            career-ops-tailor
            career-ops-tailor-report
            career-ops-tailor-v2
            career-profile-review
            mc-gmail-callback
            mc-gmail-connect
            mc-gmail-poll
            mc-render-resume
            send-email
          )
          echo "Deploying ${#FUNCTIONS[@]} reviewed functions to $ENV_NAME"
          for name in "${FUNCTIONS[@]}"; do
            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref "$REF"
            echo "::endgroup::"
          done
