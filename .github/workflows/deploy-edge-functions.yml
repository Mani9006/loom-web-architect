name: Deploy edge functions

# Deploys all supabase/functions/* to the corresponding environment when code
# lands on main (→ staging) or production (→ prod). Vercel handles the
# frontend deploy automatically; this is only for the Deno edge functions.

on:
  push:
    branches: [main, production]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Force deploy to a specific environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
          DB_PASSWORD_PRODUCTION: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          set -e
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            REF="${{ secrets.SUPABASE_PROJECT_REF_PROD }}"
            ENV_NAME="production"
            SUPABASE_DB_PASSWORD="$DB_PASSWORD_PRODUCTION"
          else
            REF="${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
            ENV_NAME="staging"
            SUPABASE_DB_PASSWORD="$DB_PASSWORD_STAGING"
          fi
          export SUPABASE_DB_PASSWORD
          if [ -z "$REF" ]; then
            echo "::error::Missing Supabase project ref for $ENV_NAME."
            exit 1
          fi
          supabase link --project-ref "$REF"
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Applying migrations to $ENV_NAME"
            supabase db push --linked
          else
            echo "::notice::No DB password for $ENV_NAME — skipping db push (migrations are managed separately); deploying functions only."
          fi
          echo "Deploying functions to $ENV_NAME"
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            # Skip the shared utilities directory — it isn't a function.
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref "$REF"
            echo "::endgroup::"
          done
