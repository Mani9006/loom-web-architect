name: Claude Code Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description for Claude Code agent'
        required: true
        type: string
      ticket_key:
        description: 'Jira ticket key (e.g. KAN-15)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  agent-dispatch:
    name: Claude Code Agent Task
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Disabled unless explicitly enabled. This legacy workflow is broader and
    # potentially more expensive than the bounded ai-review workflow. It is
    # manual-only so issue/comment text can never reach a privileged shell.
    if: vars.ENABLE_CLAUDE_AGENT == '1'
    env:
      TASK_DESCRIPTION: ${{ inputs.task }}
      TICKET_KEY: ${{ inputs.ticket_key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Quality gate (pre-check)
        run: |
          npm run type-check || true
          npm run test || true

      - name: Create working branch
        id: branch
        run: |
          BRANCH="agent/task-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Quality gate (post-work validation)
        id: validate
        run: |
          echo "Running quality gates..."
          npm run type-check 2>&1 | tail -5
          npm run test 2>&1 | tail -10
          npm run build 2>&1 | tail -5
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Push branch and create PR
        if: steps.validate.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -Eeuo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            safe_ticket="$(
              printf '%s' "${TICKET_KEY:-manual-task}" \
                | tr '\r\n' '  ' \
                | cut -c1-120
            )"
            safe_ticket="${safe_ticket:-manual-task}"
            body_file="$(mktemp)"
            trap 'rm -f "$body_file"' EXIT
            printf 'Automated task execution by Claude Code agent.\n\nTask:\n%s\n\nQuality gates: Passed\n' \
              "$TASK_DESCRIPTION" > "$body_file"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[Agent] $safe_ticket: automated task execution"
            gh auth setup-git
            git push -u origin "$BRANCH_NAME"
            gh pr create \
              --title "[Agent] $safe_ticket" \
              --body-file "$body_file" \
              --base develop
          else
            echo "No changes to commit"
          fi
