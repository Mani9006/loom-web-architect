name: Claude Code Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description for Claude Code agent'
        required: true
        type: string
      ticket_key:
        description: 'Jira ticket key (e.g. KAN-15)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-dispatch:
    name: Claude Code Agent Task
    runs-on: ubuntu-latest
    # Disabled unless explicitly enabled. This legacy workflow is broader and
    # potentially more expensive than the bounded ai-review workflow.
    if: |
      vars.ENABLE_CLAUDE_AGENT == '1' && (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'agent-task')) ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'agent-task') && github.event.comment.user.login != 'github-actions[bot]' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    steps:
      # Do not persist the token in .git/config; the push step authenticates explicitly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Determine task
        id: task
        # Event fields are untrusted: pass them via env, never inline ${{ }} in run.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_TICKET: ${{ inputs.ticket_key }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DESCRIPTION="$INPUT_TASK"
            TICKET="$INPUT_TICKET"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            DESCRIPTION="$COMMENT_BODY"
            TICKET="$ISSUE_TITLE"
          else
            DESCRIPTION="$ISSUE_BODY"
            TICKET="$ISSUE_TITLE"
          fi
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            printf 'description<<%s\n%s\n%s\n' "$DELIM" "$DESCRIPTION" "$DELIM"
            printf 'ticket=%s\n' "$(printf '%s' "$TICKET" | tr -d '\r\n')"
          } >> "$GITHUB_OUTPUT"

      - name: Quality gate (pre-check)
        run: |
          npm run type-check || true
          npm run test || true

      - name: Create working branch
        id: branch
        run: |
          BRANCH="agent/task-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Post progress comment
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Claude Code agent is working on this task...\n\nBranch: `${{ steps.branch.outputs.name }}`'
            });

      - name: Quality gate (post-work validation)
        id: validate
        run: |
          echo "Running quality gates..."
          npm run type-check 2>&1 | tail -5
          npm run test 2>&1 | tail -10
          npm run build 2>&1 | tail -5
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Push branch and create PR
        if: steps.validate.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET: ${{ steps.task.outputs.ticket }}
          DESCRIPTION: ${{ steps.task.outputs.description }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "[Agent] $TICKET: automated task execution"
            gh auth setup-git
            git push -u origin "$BRANCH"
            BODY=$(printf 'Automated task execution by Claude Code agent.\n\nTask: %s\n\nQuality gates: ✅ Passed' "$DESCRIPTION")
            gh pr create \
              --title "[Agent] $TICKET" \
              --body "$BODY" \
              --base main
          else
            echo "No changes to commit"
          fi
