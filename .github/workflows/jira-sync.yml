name: Jira Ticket Sync

on:
  schedule:
    # Check every 4 hours for review tickets
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GITHUB_REPO: Mani9006/loom-web-architect

jobs:
  sync-review-tickets:
    name: Sync Jira Review Tickets
    runs-on: ubuntu-latest
    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_USER: ${{ secrets.JIRA_USER }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'KAN' }}
    steps:
      - name: Fetch Jira tickets needing review
        id: jira
        if: ${{ env.JIRA_URL != '' }}
        run: |
          JQL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('project = $PROJECT_KEY AND status = Review ORDER BY updated DESC'))")

          RESPONSE=$(curl -s -u "$JIRA_USER:$JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_URL/rest/api/3/search/jql?jql=$JQL&maxResults=10&fields=summary,status,updated")

          DELIM="EOF_$(openssl rand -hex 16)"
          echo "review_tickets<<$DELIM" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" | jq -r '.issues[]? | "\(.key): \(.fields.summary)"' >> "$GITHUB_OUTPUT"
          echo "$DELIM" >> "$GITHUB_OUTPUT"

          COUNT=$(echo "$RESPONSE" | jq '.total // 0')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about review tickets
        if: env.JIRA_URL != '' && steps.jira.outputs.count != '0' && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          # Jira summaries are untrusted: pass via env and build JSON with jq.
          TICKET_COUNT: ${{ steps.jira.outputs.count }}
          REVIEW_TICKETS: ${{ steps.jira.outputs.review_tickets }}
        run: |
          jq -n --arg count "$TICKET_COUNT" --arg tickets "$REVIEW_TICKETS" \
            '{text: ("📋 *ResumePreps Review Alert*\n" + $count + " ticket(s) need review:\n```\n" + $tickets + "\n```\nAction: Review commits and deploy evidence before promotion.")}' \
            | curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data @-
