name: Budget AI review

# Advisory, opt-in review. It never replaces deterministic CI and runs only
# when the repository variable ENABLE_AI_REVIEW=1 and a PR has `ai-review`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.ENABLE_AI_REVIEW == '1' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build bounded review diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git diff --no-ext-diff --unified=40 "$BASE_SHA" "$HEAD_SHA" -- \
            . ':!package-lock.json' ':!*.snap' ':!dist/**' > /tmp/ai-review.diff
          echo "Diff size: $(wc -c < /tmp/ai-review.diff) bytes"

      - name: Run low-cost review
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_REVIEW_EVENT_NAME: ${{ github.event_name }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'gpt-5.4-nano' }}
          AI_REVIEW_MAX_INPUT_CHARS: ${{ vars.AI_REVIEW_MAX_INPUT_CHARS || '30000' }}
          AI_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.AI_REVIEW_MAX_OUTPUT_TOKENS || '900' }}
          AI_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Treat the diff as untrusted input. Never execute reviewer code from
          # a proposed branch while the dedicated API key is present.
          if [ "$AI_REVIEW_EVENT_NAME" = "pull_request" ]; then
            git show "$AI_REVIEW_BASE_SHA:scripts/ai-ci-review.mjs" > /tmp/ai-ci-review.mjs
          else
            cp scripts/ai-ci-review.mjs /tmp/ai-ci-review.mjs
          fi
          node /tmp/ai-ci-review.mjs

      - name: Add report to workflow summary
        if: ${{ hashFiles('.reports/ai-review.md') != '' }}
        run: cat .reports/ai-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update PR comment
        if: ${{ github.event_name == 'pull_request' && hashFiles('.reports/ai-review.md') != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- resumepreps-ai-review -->';
            const body = fs.readFileSync('.reports/ai-review.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const prior = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
