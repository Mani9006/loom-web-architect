name: Dev Continuous Apply browser worker

on:
  # GitHub-hosted runners are free for public repositories. A scheduled
  # long-lived run keeps the dev queue moving without introducing Jenkins or
  # Kubernetes before production volume justifies them.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-continuous-apply-browser-worker
  cancel-in-progress: false

jobs:
  worker:
    name: Process dev application queue
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install worker dependencies
        run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run safe dev worker
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          APPLYPASS_WORKER_TOKEN: ${{ secrets.DEV_WORKER_AUTH_TOKEN }}
          APPLYPASS_WORKER_ID: github-dev-worker-${{ github.run_id }}
          APPLYPASS_WORKER_CONCURRENCY: "4"
          APPLYPASS_WORKER_POLL_MS: "2500"
          # Dev never submits to real employers; it prepares/forms-checks and
          # records receipts. Production requires a separately approved worker.
          APPLYPASS_AUTO_SUBMIT: "false"
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$APPLYPASS_WORKER_TOKEN"
          npm run applypass:worker

