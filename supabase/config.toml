[functions.mc-gmail-callback]
# Hit by a bare browser redirect from Google with no Authorization header —
# it authenticates manually via the JWT embedded in the OAuth `state` param.
# With the default verify_jwt=true, the gateway would 401 this request
# before the function body (which does its own auth check) ever runs.
verify_jwt = false

